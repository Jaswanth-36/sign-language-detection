<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" rx="28" fill="#0d1117"/><text x="60" y="65" fill="#58a6ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Sign Language Detection — Real-Time Workflow</text><text x="60" y="102" fill="#8b949e" font-family="Arial,sans-serif" font-size="19">Webcam → hand landmarks → machine learning → Romanized multilingual text → speech</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#161b22" stroke="#30363d" stroke-width="2"><rect x="45" y="155" width="160" height="100" rx="16"/><rect x="235" y="155" width="160" height="100" rx="16"/><rect x="425" y="155" width="160" height="100" rx="16"/><rect x="615" y="155" width="160" height="100" rx="16"/><rect x="805" y="155" width="160" height="100" rx="16"/><rect x="995" y="155" width="160" height="100" rx="16"/><rect x="1185" y="155" width="160" height="100" rx="16"/></g><g fill="#f0f6fc" font-size="18"><text x="125" y="198">Webcam</text><text x="125" y="225">Frame</text><text x="315" y="198">Hand</text><text x="315" y="225">Detection</text><text x="505" y="198">21 Landmarks</text><text x="505" y="225">per hand</text><text x="695" y="198">126 Features</text><text x="695" y="225">Normalized</text><text x="885" y="198">Random Forest</text><text x="885" y="225">Prediction</text><text x="1075" y="198">Translation</text><text x="1075" y="225">Romanized Text</text><text x="1265" y="198">Text +</text><text x="1265" y="225">Speech</text></g><g fill="#58a6ff" font-size="36"><text x="215" y="215">→</text><text x="405" y="215">→</text><text x="595" y="215">→</text><text x="785" y="215">→</text><text x="975" y="215">→</text><text x="1165" y="215">→</text></g></g><rect x="55" y="320" width="1290" height="245" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="85" y="360" fill="#3fb950" font-family="Arial,sans-serif" font-size="23" font-weight="700">Example: HELLO sign</text><g font-family="Arial,sans-serif" font-size="21" fill="#c9d1d9"><text x="90" y="405">English  → hello</text><text x="90" y="445">Hindi    → namaste</text><text x="90" y="485">Telugu   → namaskaram</text><text x="90" y="525">Tamil    → vanakkam</text><text x="700" y="405">All translations are written using English/Roman letters.</text><text x="700" y="445">No native-script characters are required in the UI.</text><text x="700" y="485">The selected language text can then be sent to</text><text x="700" y="525">the speech output service.</text></g><text x="60" y="610" fill="#8b949e" font-family="Arial,sans-serif" font-size="16">Illustrative architecture diagram — translation examples are Romanized for easy reading.</text></svg>