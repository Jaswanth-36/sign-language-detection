<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" rx="28" fill="#0d1117"/><text x="70" y="70" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="36" font-weight="700">Hand Landmark Feature Extraction</text><text x="70" y="108" fill="#8b949e" font-family="Arial,sans-serif" font-size="19">How a camera frame becomes machine-learning input</text><g font-family="Arial,sans-serif"><g fill="#161b22" stroke="#30363d" stroke-width="2"><rect x="70" y="175" width="250" height="190" rx="20"/><rect x="400" y="175" width="250" height="190" rx="20"/><rect x="730" y="175" width="250" height="190" rx="20"/><rect x="1060" y="175" width="270" height="190" rx="20"/></g><g fill="#58a6ff" font-size="20" font-weight="700"><text x="195" y="220" text-anchor="middle">1. CAMERA</text><text x="525" y="220" text-anchor="middle">2. MEDIAPIPE</text><text x="855" y="220" text-anchor="middle">3. NORMALIZATION</text><text x="1195" y="220" text-anchor="middle">4. MODEL INPUT</text></g><g fill="#f0f6fc" font-size="18"><text x="195" y="265" text-anchor="middle">Live video frame</text><text x="195" y="298" text-anchor="middle">Hand visible</text><text x="195" y="331" text-anchor="middle">OpenCV capture</text><text x="525" y="265" text-anchor="middle">21 landmarks</text><text x="525" y="298" text-anchor="middle">per detected hand</text><text x="525" y="331" text-anchor="middle">1–2 hands supported</text><text x="855" y="265" text-anchor="middle">Coordinate scaling</text><text x="855" y="298" text-anchor="middle">Stable feature vector</text><text x="855" y="331" text-anchor="middle">Noise reduction</text><text x="1195" y="265" text-anchor="middle">126 features</text><text x="1195" y="298" text-anchor="middle">Random Forest</text><text x="1195" y="331" text-anchor="middle">Class prediction</text></g><g fill="#58a6ff" font-size="38"><text x="340" y="285">→</text><text x="670" y="285">→</text><text x="1000" y="285">→</text></g></g><rect x="70" y="420" width="1260" height="145" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="105" y="465" fill="#3fb950" font-family="Arial,sans-serif" font-size="22" font-weight="700">Feature representation</text><text x="105" y="510" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="20">21 landmarks × (x, y, z) × 2 hands = 126 numeric inputs</text><text x="105" y="545" fill="#8b949e" font-family="Arial,sans-serif" font-size="16">The exact feature layout depends on the project's landmark preprocessing implementation.</text></svg>