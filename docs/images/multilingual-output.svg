<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" rx="28" fill="#0d1117"/><text x="70" y="70" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="36" font-weight="700">Multilingual Output</text><text x="70" y="108" fill="#8b949e" font-family="Arial,sans-serif" font-size="19">All displayed translations use English / Roman letters</text><g font-family="Arial,sans-serif"><g fill="#161b22" stroke="#30363d" stroke-width="2"><rect x="70" y="160" width="1260" height="90" rx="16"/><rect x="70" y="275" width="1260" height="90" rx="16"/><rect x="70" y="390" width="1260" height="90" rx="16"/><rect x="70" y="505" width="1260" height="90" rx="16"/></g><g fill="#58a6ff" font-size="19" font-weight="700"><text x="105" y="214">ENGLISH</text><text x="105" y="329">HINDI</text><text x="105" y="444">TELUGU</text><text x="105" y="559">TAMIL</text></g><g fill="#f0f6fc" font-size="30" font-weight="700"><text x="370" y="216">hello</text><text x="370" y="331">namaste</text><text x="370" y="446">namaskaram</text><text x="370" y="561">vanakkam</text></g><g fill="#8b949e" font-size="17"><text x="700" y="214">Readable directly in the application UI</text><text x="700" y="329">Romanized Hindi — no Devanagari required</text><text x="700" y="444">Romanized Telugu — no Telugu script required</text><text x="700" y="559">Romanized Tamil — no Tamil script required</text></g></g><text x="70" y="625" fill="#8b949e" font-family="Arial,sans-serif" font-size="15">Example terminology is illustrative; exact translations depend on the detected sign and language map.</text></svg>